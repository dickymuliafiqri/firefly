<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firefly — ornament preview</title>
<style>
  body { margin: 0; background: #04080c; color: #a8b8ac; font: 14px/1.6 system-ui, sans-serif; }
  h1 { font-size: 18px; color: #eef4ec; margin: 28px 24px 4px; font-weight: 600; }
  p.note { margin: 0 24px 20px; max-width: 70ch; }
  h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #bef264; margin: 34px 24px 10px; font-weight: 600; }
  .stage { position: relative; margin: 0 24px 10px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; overflow: hidden; background: #04080c; }
  .band { position: relative; height: 250px; }
  .band img { position: absolute; left: -1%; width: 102%; object-fit: fill; }
  .b-mist  { bottom: 10%; height: 52%; opacity: .8; }
  .b-far   { bottom: 8%;  height: 74%; }
  .b-near  { bottom: 0;   height: 100%; }
  .b-floor { bottom: 0;   height: 62%; }
  .corner { position: relative; height: 420px; }
  .corner img { position: absolute; }
  .canopy-l { top: 0; left: 0; width: 400px; }
  .canopy-r { top: 0; right: 0; width: 400px; }
  .grove    { bottom: 0; right: 6%; width: 300px; }
  .fern     { bottom: 0; left: 8%; width: 260px; }
  .zoom { padding: 30px; display: flex; gap: 20px; align-items: flex-end; }
  .zoom .tile { background: #04080c; border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 6px; }
  .zoom img { display: block; }
</style>
</head>
<body>
  <h1>Ornament preview</h1>
  <p class="note">Generated by <code>gen-forest.mjs</code>. Layout below mimics the landing page stacking: mist → far pines → near pines → floor, then the hero corners.</p>

  <h2>Band — hero &amp; footer stacking</h2>
  <div class="stage band">
    <img class="b-mist"  src="../assets/img/orn-mist-far.svg" alt="">
    <img class="b-far"   src="../assets/img/orn-pines-far.svg" alt="">
    <img class="b-near"  src="../assets/img/orn-pines-near.svg" alt="">
    <img class="b-floor" src="../assets/img/orn-floor.svg" alt="">
  </div>

  <h2>Hero corners</h2>
  <div class="stage corner">
    <img class="canopy-l" src="../assets/img/orn-canopy-left.svg" alt="">
    <img class="canopy-r" src="../assets/img/orn-canopy-right.svg" alt="">
    <img class="grove"    src="../assets/img/orn-grove-right.svg" alt="">
    <img class="fern"     src="../assets/img/orn-fern-left.svg" alt="">
  </div>

  <h2>Floor zoom</h2>
  <div class="zoom">
    <div class="tile"><img src="../assets/img/orn-floor.svg" width="900" alt=""></div>
  </div>
</body>
</html>
