openapi: 3.1.0
info:
  title: Firefly Harvester Sync API
  # Placeholder only. The running binary replaces this with its build version
  # at startup (server.SetBuildVersion); do not hand-edit it to track a release.
  version: "0.0.0-dev"
  description: >
    Machine-to-machine surface for the credential harvester. The harvester owns
    discovery of upstream providers and their API keys; this endpoint ships that
    snapshot to the gateway, which owns the routing copy of the same rows.


    Every call must present a dedicated service token (`Authorization: Bearer
    <token>`), configured on the gateway via `FIREFLY_HARVESTER_TOKEN`. Dashboard
    sessions and the admin token are deliberately rejected here: the harvester
    identity cannot reach the admin surface and vice versa. When no service token
    is configured the endpoint fails closed with 503 rather than allowing
    anonymous writes.


    A batch is applied in a single transaction. It is fully idempotent: replaying
    the same payload creates nothing new, and `api_keys.id` is never reassigned
    (routing derives credential references from it as `<upstream>-key-<id>`).
    Deactivation is explicit-id only — the gateway never infers deletions from
    absence, so a partial payload cannot silently drop a live key.


    After a successful commit the gateway bumps its catalog revision and rebuilds
    the routing snapshot before responding, so `reloaded: true` means the keys in
    `key_ids` are routable immediately. The public `/v1/*` surface is documented
    separately at `/api/openapi.yaml`; the operator surface is at
    `/api/openapi-admin.yaml`.
  contact:
    name: Firefly
    url: https://github.com/dickymuliafiqri/firefly

servers:
  - url: /
    description: The gateway origin serving this document.

tags:
  - name: Harvester
    description: Credential pool synchronization (providers and API keys).

security:
  - ServiceAuth: []

paths:
  /api/harvester/sync:
    post:
      tags: [Harvester]
      summary: Synchronize the provider and API key pool
      description: >
        Applies one batch of providers, API keys, and explicit deactivations.


        Providers are upserted by `name`, which is the natural key; an entry
        never renames an existing row. Keys are upserted by `api_key` itself,
        which is globally unique across providers: sending a secret that already
        exists under a different provider is rejected with 409 instead of moving
        the row, because that would hand one provider's quota to another. A key
        may reference a provider declared in the same batch.


        For keys that already exist, `status` is authoritative and replaces the
        stored value. `expires_at` carries three distinct intents: a number
        replaces the stored expiry, an explicit `null` clears it, and an omitted
        field keeps whatever is stored — a batch that refreshes a row it did not
        create must not silently un-expire it. An omitted `account_metadata`
        keeps the stored blob: it is a write-only credential vault and is never
        returned by any endpoint. New keys default to `status: active` with no
        expiry. Live usage metering (`last_used_at`, `total_requests`) is owned
        by the traffic pipeline and is never written by a sync.


        Limits per batch: 500 providers, 10000 keys, 20000 deactivation ids, and
        64 KiB per `account_metadata` blob. Larger snapshots are chunked by the
        client. Bodies over the 32 MiB gateway limit return 413.

        Every timestamp in this contract is a Unix epoch in milliseconds. The
        whole batch is validated before anything is written, so one entry with a
        malformed shape — a value longer than its column, a status with padding
        or control characters, a second-scale `expires_at` — is a 400 that
        changes nothing rather than a partial apply.
      operationId: syncHarvesterPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: >
            The batch was committed. If the catalog reload also succeeded,
            `reloaded` is true and the returned `key_ids` are already routable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    ServiceAuth:
      type: http
      scheme: bearer
      description: >
        The service token configured as `FIREFLY_HARVESTER_TOKEN` on the gateway.
        A missing or invalid token returns 401; an unconfigured token returns 503.
        Admin bearer tokens and dashboard session tokens are not accepted.

  responses:
    Unauthorized:
      description: Missing or invalid service credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "invalid or missing service credential"
              type: authentication_error
              param: null
              code: null
    BadRequest:
      description: >
        Malformed JSON, an empty batch, a missing required field (provider name,
        key provider, key api_key), an unknown provider, a batch exceeding the
        item limits, or an oversized `account_metadata` blob.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >
        A key secret that already exists under a different provider. The batch is
        rolled back and nothing is applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeded the 32 MiB gateway limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >
        The transaction failed and was rolled back; nothing was applied. The
        response is deliberately generic and carries no database detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: >
        No service token is configured (the endpoint fails closed), or the Turso
        credential store is unavailable. A write-only file-storage deployment
        cannot accept harvester syncs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      description: OpenAI-shaped error envelope.
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - api_error
            param:
              type: [string, "null"]
            code:
              type: [string, "null"]

    SyncRequest:
      type: object
      description: >
        One synchronization batch. At least one of `providers`, `keys`, or
        `deactivate_keys` must be non-empty; an empty payload is rejected.
      properties:
        providers:
          type: array
          description: Providers to create or update, matched by `name`.
          items:
            $ref: "#/components/schemas/ProviderEntry"
        keys:
          type: array
          description: Credentials to create or update, matched by `api_key`.
          items:
            $ref: "#/components/schemas/KeyEntry"
        deactivate_keys:
          type: array
          description: >
            Explicit `api_keys.id` values to deactivate. Idempotent: ids that are
            already inactive, unknown, or non-positive are ignored and not
            counted. Deactivation also deactivates gateway credentials bound to
            the key, exactly as the upstream error policy does.
          items:
            type: integer
            format: int64

    ProviderEntry:
      type: object
      required: [name, base_url]
      properties:
        name:
          type: string
          maxLength: 64
          description: Natural key; max 64 chars. Never renames an existing provider.
        base_url:
          type: string
          maxLength: 255
          description: Upstream base URL, max 255 chars.
        description:
          type: string
          maxLength: 255
          description: Free-form, max 255 chars. Omitted or empty clears the column.
        is_active:
          type: boolean
          description: Whether the provider participates in routing. Defaults to true.

    KeyEntry:
      type: object
      required: [provider, api_key]
      properties:
        provider:
          type: string
          description: >
            Provider `name`. May be declared in the same batch, otherwise it must
            already exist — an unknown name fails the whole batch with 400.
        api_key:
          type: string
          description: >
            The credential secret. Globally unique across all providers: it is the
            upsert key, and it is never echoed back by any response.
        status:
          type: string
          maxLength: 20
          description: >
            Credential state. Only `active` is routable; any other well-formed
            value (for example `deactivated`, `dead`, or `rate_limited`) is
            stored verbatim and excluded from routing — the state vocabulary
            belongs to the writer, so an unrecognised value never fails the
            batch. Shape is enforced: 20 characters max, no control characters,
            no leading or trailing whitespace. Defaults to `active`, which means
            an omitted status on an existing key reactivates it.
          examples: ["active"]
        expires_at:
          type: [integer, "null"]
          format: int64
          minimum: 100000000000
          description: >
            Expiry as a Unix epoch in **milliseconds**. Live keys past this point
            are excluded from routing. The field carries three distinct intents: a
            number replaces the stored expiry, an explicit `null` clears it (no
            expiration), and an omitted field keeps whatever is already stored. A
            value below 100000000000 is rejected with 400: it can
            only be a second-scale timestamp, and in a millisecond column that
            reads as expired in 1970, which would silently drop the key.
        account_metadata:
          type: string
          description: >
            Opaque credential vault blob (private keys, mnemonics, OAuth tokens)
            written verbatim into the `account_metadata` column, max 64 KiB per
            key. Never returned by any endpoint. Omit it to keep the stored blob;
            it is not cleared by omission.

    SyncResponse:
      type: object
      description: >
        What the committed batch changed. The change counters describe API keys
        only; provider upserts are not counted.
      required: [created, updated, unchanged, deactivated, key_ids, revision, pushed, reloaded]
      properties:
        created:
          type: integer
          description: Keys inserted by this batch.
        updated:
          type: integer
          description: Keys whose stored attributes changed.
        unchanged:
          type: integer
          description: >
            Keys already matching the payload. An unchanged key does not advance
            its `updated_at`, so replayed snapshots do not churn the gateway's
            change detection.
        deactivated:
          type: integer
          description: Keys that actually transitioned to inactive in this batch.
        key_ids:
          type: object
          description: >
            Every routable key id per provider touched by this batch, using the
            same predicate as routing (active, status `active`, and not expired).
            Providers with no routable keys map to an empty array. Providers that
            a batch does not mention are absent.
          additionalProperties:
            type: array
            items:
              type: integer
              format: int64
        revision:
          type: integer
          format: int64
          description: >
            Catalog revision after the bump applied in the same transaction. It
            advances on every accepted batch, including no-op replays, so a sync
            is never mistaken for "nothing was applied".
        pushed:
          type: boolean
          description: >
            True when the local write was also pushed to Turso Cloud. False in
            embedded-only mode, or when the push failed (the local replica still
            holds the write and the next sync retries it).
        reloaded:
          type: boolean
          description: >
            True when the routing snapshot was rebuilt before this response, so
            `key_ids` are live. False means the write is committed but not yet
            visible to routing; the periodic sync publishes it within its
            interval.
