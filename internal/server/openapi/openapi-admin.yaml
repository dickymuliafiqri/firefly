openapi: 3.1.0
info:
  title: Firefly Admin API
  # Placeholder only. The running binary replaces this with its build version
  # at startup (server.SetBuildVersion); do not hand-edit it to track a release.
  version: "0.0.0-dev"
  description: >
    Administrative surface for the Firefly LLM gateway dashboard. Every
    endpoint requires an authenticated operator: either an active dashboard
    session token (obtained via `POST /api/auth/login`) or the configured
    admin bearer token, presented as `Authorization: Bearer <token>`.

    This document covers tenant lifecycle management under `/api/tenants`
    and provider/credential-pool administration under `/api/providers` and
    `/api/keys`. Tenant mutations persist through the same validate-then-store
    pipeline as the bulk settings endpoint (Turso when configured, otherwise
    the config files) and hot-swap the routing snapshot, so changes take effect
    immediately without a restart. Provider and key records live only in the
    Turso database and are refused with 503 when no store is configured. The
    public `/v1/*` surface is documented separately at `/api/openapi.yaml`.

    Credential discipline: stored keys are never returned. Key reads carry a
    masked `api_key_hint` only, and because that hint is the sole credential
    shape this surface ever shows, a secret in mask shape is refused on writes
    instead of being stored as a routable credential. `account_metadata` — the
    vault holding private keys, mnemonics, and OAuth material — is accepted on
    writes but never read back by any endpoint.
  contact:
    name: Firefly
    url: https://github.com/dickymuliafiqri/firefly

servers:
  - url: /
    description: The gateway origin serving this document.

tags:
  - name: Tenants
    description: Tenant catalog lifecycle (CRUD plus balance top-up).
  - name: Providers
    description: >
      Provider records and their credential pools (CRUD, key batch upsert, and
      per-key status control plus in-place secret rotation). Backed exclusively
      by the Turso database: every handler fails closed with 503 when no store
      is configured. Sensitive
      fields are write-only or masked, never echoed.

security:
  - AdminAuth: []

paths:
  /api/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      description: >
        Returns the full tenant catalog from the authoritative configuration
        store (Turso when configured, otherwise the config files). Tenant API
        keys are returned in plaintext, like `GET /api/settings`, because they
        are working credentials the operator must be able to copy.
      operationId: listTenants
      responses:
        "200":
          description: The tenant catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Tenants]
      summary: Create tenant
      description: >
        Appends a tenant to the catalog. The name must be unique; duplicate
        names return 409. When `api_key` is omitted a fresh gateway key
        (`sk-gw-` plus random hex) is generated automatically, and `key_hash`
        is derived from the plaintext key when absent. The full catalog is
        re-validated before persisting: an unknown `allowed_models` entry or a
        missing `credential_ref` environment variable fails the request with
        400 and changes nothing.
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: Tenant created and live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tenants/{name}:
    get:
      tags: [Tenants]
      summary: Retrieve a tenant
      description: Returns one tenant by display name.
      operationId: getTenant
      parameters:
        - $ref: "#/components/parameters/TenantName"
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [Tenants]
      summary: Update tenant
      description: >
        Overlays the operator-managed fields of an existing tenant; absent or
        zero-valued fields keep their stored values, so partial edits never
        silently clear quota or access. Credential rotation happens only when
        the body carries an explicit, unmasked `api_key` that differs from the
        stored one — omitting `api_key` or echoing the masked placeholder from
        a previous GET preserves the current credential. `used_tokens` is
        metered state owned by the traffic pipeline and the topup endpoint; it
        is never taken from the request.
      operationId: updateTenant
      parameters:
        - $ref: "#/components/parameters/TenantName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Tenant updated and live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Tenants]
      summary: Delete tenant
      description: >
        Removes the tenant from the catalog, including deleting the last
        remaining tenant. Subsequent requests authenticated with the tenant's
        key fail with 401.
      operationId: deleteTenant
      parameters:
        - $ref: "#/components/parameters/TenantName"
      responses:
        "200":
          description: Tenant deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tenants/topup:
    post:
      tags: [Tenants]
      summary: Top up tenant balance
      description: >
        Adds tokens, extends the expiry window, and/or resets consumed usage
        for a tenant identified by `api_key` or `tenant_name`. An
        `exhausted` or `expired` tenant returns to `active`. Persisted to the
        database when Turso is configured.
      operationId: topupTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantTopupRequest"
      responses:
        "200":
          description: Top-up applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTopupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/providers:
    get:
      tags: [Providers]
      summary: List providers
      description: >
        Returns every provider record, active or inactive, ordered by name,
        each with the count of keys currently routable through the same
        predicate the data plane uses. Unlike the legacy
        `GET /api/turso/providers`, a storage failure is surfaced as an error
        instead of degrading to an empty list.
      operationId: listProviders
      responses:
        "200":
          description: The provider catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Providers]
      summary: Create provider
      description: >
        Inserts one provider. `name` and `base_url` are required, and the name
        must be unique because it is the natural key the harvester syncs
        against — a duplicate returns 409 rather than silently capturing the
        existing pool. The catalog revision is bumped and an immediate reload
        is attempted, so the record is visible to routing before the response
        returns.
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreate"
      responses:
        "201":
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/providers/{id}:
    get:
      tags: [Providers]
      summary: Retrieve a provider
      description: Returns one provider by numeric id, active or not.
      operationId: getProvider
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [Providers]
      summary: Update provider
      description: >
        Partial update: `base_url`, `description`, and `is_active` are applied
        when present, and an absent field keeps its stored value. The name is
        not editable (providers are matched by name, so a rename would orphan
        the credential pool); sending a different name is a 400. An empty body
        is rejected as a client bug rather than treated as a no-op.
      operationId: updateProvider
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Providers]
      summary: Delete provider
      description: >
        Hard-deletes the provider together with its keys and their bound
        credentials (the operator-only right; the harvester can only upsert and
        deactivate). Refused with 409 while any upstream still references the
        provider, because the delete would silently detach that upstream's
        credential pool — detach or delete the upstreams first.
      operationId: deleteProvider
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "200":
          description: Provider and its keys deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/providers/{id}/keys:
    get:
      tags: [Providers]
      summary: List provider keys
      description: >
        Returns every key of one provider in any lifecycle state, each with a
        masked `api_key_hint` instead of its secret. `account_metadata` is
        never included.
      operationId: listProviderKeys
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "200":
          description: The provider's keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Providers]
      summary: Upsert provider keys
      description: >
        Applies a batch of credentials to one provider. Rows are matched by the
        secret itself (`api_key` is globally unique) and keep their id, so
        replaying a batch never duplicates or renumbers credentials. An omitted
        `status` means `active`. `expires_at` carries three distinct intents: a
        number replaces the stored expiry, an explicit `null` clears it, and an
        omitted field keeps whatever is already stored, because a batch that
        refreshes a row it did not create must not silently un-expire it. An
        omitted `account_metadata` keeps the stored vault blob because it is
        large write-only data clients may legitimately not resend. This endpoint
        only ever returns masked hints, so a secret in mask shape is refused
        with 400 rather than stored as a routable credential. A key already
        owned by another provider is refused with 409
        unless the body sets `reassign: true`, in which case it moves here and
        the previous provider's bound credentials are dropped. The whole batch
        is one transaction: a rejected entry changes nothing. Limits are this
        route's own: 32 MiB per request and at most 10000 keys per batch.
      operationId: upsertProviderKeys
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeyUpsertRequest"
      responses:
        "200":
          description: Batch applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/keys/{id}:
    patch:
      tags: [Providers]
      summary: Update key state or rotate its secret
      description: >
        Partial update of one key's `api_key`, `status`, `is_active`, and/or
        `expires_at`. A status-only edit keeps `is_active` coherent with it,
        because routing requires both to agree. `expires_at` is a Unix
        millisecond timestamp, or `null` to clear the expiry. A key that is no
        longer routable is mirrored onto the credentials bound to it so it stops
        serving immediately. At least one field is required; an empty patch is a
        400.

        `api_key` rotates the credential in place: the row keeps its id, which
        is what upstream credential refs are derived from, so rotation does not
        renumber the pool or require a delete-and-reinsert. Every
        `upstream_credentials` row bound to the key is rewritten with the new
        secret in the same transaction, because the snapshot loader prefers that
        copy over the joined key value and would otherwise keep serving the
        retired credential. A secret another row already holds is refused with
        409 — applying it would merge two providers' credentials into one row.
        The response returns the masked hint of the new secret and never either
        secret.
      operationId: patchProviderKey
      parameters:
        - $ref: "#/components/parameters/KeyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyPatchRequest"
      responses:
        "200":
          description: Key updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Providers]
      summary: Delete key
      description: >
        Hard-deletes one credential and every `upstream_credentials` row bound
        to it, so its refs disappear from all upstreams. This is the
        operator-only right: the harvester path can upsert and deactivate but
        never delete.
      operationId: deleteProviderKey
      parameters:
        - $ref: "#/components/parameters/KeyID"
      responses:
        "200":
          description: Key deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyDeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    AdminAuth:
      type: http
      scheme: bearer
      description: >
        Dashboard session token (from `POST /api/auth/login`) or the
        configured admin bearer token. A missing or invalid token returns 401.

  parameters:
    TenantName:
      name: name
      in: path
      required: true
      description: The tenant display name (exact match, case-sensitive).
      schema:
        type: string
        examples: ["acme-corp"]
    ProviderID:
      name: id
      in: path
      required: true
      description: Numeric provider id (`providers.id`).
      schema:
        type: integer
        format: int64
        minimum: 1
        examples: [3]
    KeyID:
      name: id
      in: path
      required: true
      description: Numeric credential id (`api_keys.id`). Stable across upserts.
      schema:
        type: integer
        format: int64
        minimum: 1
        examples: [184]

  responses:
    Unauthorized:
      description: Missing or invalid admin credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "unauthorized: valid dashboard session or admin token required"
              type: authentication_error
              param: null
              code: null
    BadRequest:
      description: Malformed JSON, a missing required field, a body/path name mismatch, or catalog validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested tenant, provider, or key does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >
        The request conflicts with stored state: a duplicate tenant or provider
        name, a provider still referenced by upstreams, or a credential already
        owned by another row — submitted to a batch without `reassign: true`, or
        to a rotation that cannot merge two keys into one secret.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeded the 32 MiB gateway limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: No configuration source (database, config files, or loaded snapshot) is available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Persisting the updated catalog failed (storage error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      description: OpenAI-shaped error envelope.
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - api_error
            param:
              type: [string, "null"]
            code:
              type: [string, "null"]

    RateLimit:
      type: object
      description: Per-tenant admission limits.
      properties:
        rps:
          type: number
          format: double
          description: Sustained requests per second (token bucket).
        burst:
          type: integer
          description: Token bucket burst capacity.
        max_concurrent:
          type: integer
          description: Maximum in-flight requests for the tenant.

    Tenant:
      type: object
      description: A tenant as stored in the catalog.
      required: [name, status]
      properties:
        api_key:
          type: string
          description: >
            Plaintext gateway key. Only ever exposed to authenticated admins;
            identical masking rules apply as for `GET /api/settings`.
          examples: ["sk-gw-1a2b3c4d5e6f7890abcdef1234567890"]
        key_hash:
          type: string
          description: Canonical `sha256:<hex>` hash of the plaintext key; the stable identity used at auth time.
          examples: ["sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]
        name:
          type: string
          description: Unique display name; also the path parameter for single-tenant routes.
        status:
          type: string
          enum: [active, suspended, exhausted, expired]
          description: >
            `suspended` rejects traffic with 401; `exhausted`/`expired` are set
            automatically as quota or time runs out.
        max_tokens:
          type: integer
          format: int64
          description: Token quota ceiling; 0 means unlimited.
        used_tokens:
          type: integer
          format: int64
          readOnly: true
          description: Metered consumption, owned by the traffic pipeline; never writable.
        expires_at:
          type: [integer, "null"]
          format: int64
          description: Expiry as a Unix epoch in milliseconds; null or absent means never expires.
        allowed_models:
          type: array
          items:
            type: string
          description: Model or combo public names this tenant may call. `["*"]` (the default) allows everything that exists.
        credential_ref:
          type: string
          description: Name of an environment variable holding an upstream credential the tenant may draw from.
        rate_limit:
          $ref: "#/components/schemas/RateLimit"
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Free-form operator labels attached to the tenant.

    TenantCreate:
      type: object
      description: Payload for `POST /api/tenants`.
      required: [name]
      properties:
        name:
          type: string
        api_key:
          type: string
          description: Existing plaintext key to adopt; generated when omitted.
        key_hash:
          type: string
          description: Pre-hashed `sha256:<hex>` identity; derived from `api_key` when omitted.
        status:
          type: string
          enum: [active, suspended, exhausted, expired]
        max_tokens:
          type: integer
          format: int64
        expires_at:
          type: [integer, "null"]
          format: int64
        allowed_models:
          type: array
          items:
            type: string
        credential_ref:
          type: string
        rate_limit:
          $ref: "#/components/schemas/RateLimit"
        metadata:
          type: object
          additionalProperties:
            type: string

    TenantUpdate:
      type: object
      description: >
        Payload for `PUT /api/tenants/{name}`. Overlay semantics: a field
        absent from the body keeps its stored value. The `name` field, when
        present, must equal the path parameter.
      properties:
        name:
          type: string
          description: Must match the `{name}` path parameter when present.
        api_key:
          type: string
          description: >
            New plaintext key for credential rotation. Omit it, or echo the
            masked placeholder from a previous GET, to keep the current
            credential. `key_hash` is re-derived automatically and is not
            accepted in the update body.
        status:
          type: string
          enum: [active, suspended, exhausted, expired]
        max_tokens:
          type: integer
          format: int64
        expires_at:
          type: [integer, "null"]
          format: int64
        allowed_models:
          type: array
          items:
            type: string
        credential_ref:
          type: string
        rate_limit:
          $ref: "#/components/schemas/RateLimit"
        metadata:
          type: object
          additionalProperties:
            type: string

    TenantListResponse:
      type: object
      required: [tenants]
      properties:
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"

    TenantMutationResponse:
      type: object
      required: [tenant, generation, warnings]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        generation:
          type: integer
          format: int64
          description: Routing snapshot generation after the hot-swap; increments on every mutation.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal validation notes from catalog rebuild (e.g. defaulted rate limits).

    TenantDeleteResponse:
      type: object
      required: [status, name, generation]
      properties:
        status:
          type: string
          const: ok
        name:
          type: string
        generation:
          type: integer
          format: int64

    TenantTopupRequest:
      type: object
      description: At least one of `api_key` or `tenant_name` is required.
      properties:
        api_key:
          type: string
          description: Plaintext key of the tenant to top up.
        tenant_name:
          type: string
          description: Display name; used when `api_key` is absent or unmatched.
        add_tokens:
          type: integer
          format: int64
          description: Tokens added to `max_tokens`.
        extend_days:
          type: integer
          description: Days added to the expiry timestamp (from now when already expired).
        reset_used:
          type: boolean
          description: Zero out `used_tokens`.

    TenantTopupResponse:
      type: object
      required: [success, message, name, api_key, max_tokens, used_tokens, remaining_tokens, status]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        name:
          type: string
        api_key:
          type: string
        max_tokens:
          type: integer
          format: int64
        used_tokens:
          type: integer
          format: int64
        remaining_tokens:
          type: integer
          format: int64
        expires_at:
          type: [integer, "null"]
          format: int64
        status:
          type: string
          enum: [active, suspended, exhausted, expired]

    Provider:
      type: object
      description: A provider record as stored.
      required: [id, name, base_url, is_active]
      properties:
        id:
          type: integer
          format: int64
          examples: [3]
        name:
          type: string
          description: >
            Unique provider name; the natural key the harvester syncs against,
            and therefore not editable.
          examples: ["openai-pool"]
        base_url:
          type: string
          description: Provider API origin, e.g. `https://api.openai.com`.
        description:
          type: string
        is_active:
          type: boolean
          description: >
            Operator switch. Inactive providers are still listed but excluded
            from routing decisions.
        active_keys:
          type: integer
          readOnly: true
          description: >
            Keys currently routable through this provider, counted with the
            same predicate the data plane uses (active status, enabled, not
            expired).
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    ProviderCreate:
      type: object
      description: Payload for `POST /api/providers`.
      required: [name, base_url]
      properties:
        name:
          type: string
          maxLength: 64
        base_url:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        is_active:
          type: boolean
          description: Defaults to `true`.

    ProviderUpdate:
      type: object
      description: >
        Payload for `PUT /api/providers/{id}`. Overlay semantics: an absent
        field keeps its stored value. `name`, when present, must equal the
        stored name.
      properties:
        name:
          type: string
          description: Echo of the stored name; a different value is a 400.
        base_url:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        is_active:
          type: boolean

    ProviderResponse:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"

    ProviderListResponse:
      type: object
      required: [count, providers]
      properties:
        count:
          type: integer
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    ProviderMutationResponse:
      type: object
      required: [provider, reloaded]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        reloaded:
          type: boolean
          description: >
            Whether the routing snapshot was rebuilt before this response was
            written. `false` is not an error: the write committed and bumped
            the catalog revision, so the periodic syncer publishes it on its
            next tick.

    ProviderDeleteResponse:
      type: object
      required: [status, id, deleted_keys, reloaded]
      properties:
        status:
          type: string
          const: ok
        id:
          type: integer
          format: int64
        deleted_keys:
          type: integer
          description: Number of credentials removed along with the provider.
        reloaded:
          type: boolean

    ProviderKey:
      type: object
      description: >
        One stored credential. The secret itself is never returned; reads carry
        a masked hint only. `account_metadata` is write-only and never appears
        in any response.
      required: [id, provider_id, status, is_active]
      properties:
        id:
          type: integer
          format: int64
        provider_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, deactivated, expired, revoked]
          description: >
            Only `active` is routable. `deactivated` and `revoked` are written
            by the data-plane key policy, `expired` by the expiry sweep, and
            all four may be set by an operator through the patch endpoint.
        is_active:
          type: boolean
        expires_at:
          type: [integer, "null"]
          format: int64
          description: Expiry as a Unix epoch in milliseconds; absent means never expires.
        last_used_at:
          type: integer
          format: int64
        total_requests:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        api_key_hint:
          type: string
          readOnly: true
          description: >
            Masked hint (`first 3 + "..." + last 4` characters, or
            `[REDACTED]` for short secrets) so an operator can recognize a key
            without it being recoverable.
          examples: ["sk-...mnop"]

    ProviderKeyListResponse:
      type: object
      required: [provider_id, count, keys]
      properties:
        provider_id:
          type: integer
          format: int64
        count:
          type: integer
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ProviderKey"

    ProviderKeyUpsertEntry:
      type: object
      description: >
        One credential in an upsert batch. `provider` is optional and, when
        present, must match the provider in the route path.
      required: [api_key]
      properties:
        provider:
          type: string
          description: Provider name; a mismatch with the route is a 400.
        api_key:
          type: string
          description: >
            The credential material. Stored, never echoed back, and capped at
            4096 bytes. A value in mask shape (the `api_key_hint` form) is
            refused with 400, because this surface only ever returns hints and
            storing one would create a routable credential that no upstream
            accepts.
        status:
          type: string
          enum: [active, deactivated, expired, revoked]
          description: Authoritative on every write; omitted means `active`.
        expires_at:
          type: [integer, "null"]
          format: int64
          minimum: 100000000000
          description: >
            Unix milliseconds. Three distinct intents: a number replaces the
            stored expiry, an explicit null clears it, and an omitted field keeps
            whatever is stored. A value below 100000000000 is a 400 — it can only
            be a second-scale timestamp, which reads as expired in 1970 against a
            millisecond column.
        account_metadata:
          type: object
          description: >
            Free-form vault blob (private keys, mnemonics, OAuth material).
            Write-only: an omitted value keeps the stored blob, and no read
            endpoint ever returns it. Capped at 64 KiB per key.

    ProviderKeyUpsertRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: At least one entry; capped at 10,000 per batch.
          items:
            $ref: "#/components/schemas/ProviderKeyUpsertEntry"
        reassign:
          type: boolean
          description: >
            Allow entries whose secret is already owned by another provider to
            move here. Without it such an entry fails the whole batch with 409.

    ProviderKeyUpsertResponse:
      type: object
      required: [created, updated, unchanged, reassigned, key_ids, revision, pushed, reloaded]
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
          description: Entries whose stored row already matched the payload.
        reassigned:
          type: integer
          description: How many of `updated` moved between providers.
        key_ids:
          type: array
          description: >
            Every currently routable key id of the provider after the batch,
            ordered by id — the authoritative list for the operator's view.
          items:
            type: integer
            format: int64
        revision:
          type: integer
          format: int64
          description: Catalog revision after the write.
        pushed:
          type: boolean
          description: Whether the local replica reached the Turso cloud.
        reloaded:
          type: boolean

    KeyPatchRequest:
      type: object
      description: At least one property is required.
      properties:
        api_key:
          type: string
          description: >
            New credential secret, max 4096 bytes. Rotates the key in place and
            re-mirrors the credentials bound to it. A value already held by
            another key is a 409; a masked hint, padding, or control characters
            are a 400.
        status:
          type: string
          enum: [active, deactivated, expired, revoked]
        is_active:
          type: boolean
          description: >
            Explicit routing switch; when set it wins over the value implied by
            `status`.
        expires_at:
          type: [integer, "null"]
          format: int64
          minimum: 100000000000
          description: >
            Unix milliseconds, or null to clear the stored expiry. Omitting the
            field keeps it. A second-scale value is a 400.

    KeyPatchResponse:
      type: object
      required: [key, revision, pushed, reloaded]
      properties:
        key:
          $ref: "#/components/schemas/ProviderKey"
        revision:
          type: integer
          format: int64
        pushed:
          type: boolean
        reloaded:
          type: boolean

    KeyDeleteResponse:
      type: object
      required: [status, id, revision, pushed, reloaded]
      properties:
        status:
          type: string
          const: ok
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        pushed:
          type: boolean
        reloaded:
          type: boolean
